<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standard Material Cut Length Optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#1B2126;
  --ink-soft:#4A535C;
  --paper:#F5F6F4;
  --panel:#FFFFFF;
  --line:#D7DBDD;
  --line-strong:#B8BEC2;
  --steel:#2B5F8A;
  --steel-dark:#1E4666;
  --rust:#B5502F;
  --brass:#8A6D2F;
  --moss:#4C6B4A;
  --slate:#5B5F73;
  --good:#3C7A57;
  --warn:#B5502F;
  --offcut:#C9CDC6;
  --offcut-line:#9AA09A;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

.masthead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-bottom:3px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:28px;
  gap:16px;
  flex-wrap:wrap;
}
.masthead h1{
  font-size:23px;
  margin:0;
  font-weight:700;
  letter-spacing:-0.01em;
}
.masthead .sub{

  font-size:13px;
  margin-top:4px;
}
.masthead-actions{display:flex;gap:8px;}

.section{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:18px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
  gap:12px;
  flex-wrap:wrap;
}
.section-head h2{
  font-size:14px;
  margin:0;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:9px;
}
.section-head h2 .num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:20px;height:20px;
  background:var(--ink);
  color:#fff;
  border-radius:2px;
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
}
.section-head p{margin:0;font-size:12.5px;color:var(--ink-soft);}

table.dtab thead th{

  font-weight:600;
  font-size:11.5px;
  color:var(--ink-soft);

}
table.dtab tbody td{

  vertical-align:middle;
}
table.dtab tbody tr:last-child td{border-bottom:none;}
table.dtab input[type=text],table.dtab input[type=number]{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  padding:5px 6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  border-radius:2px;
  color:var(--ink);
}
table.dtab input:hover{border-color:var(--line);}
table.dtab input:focus{outline:none;border-color:var(--steel);background:#fff;}
table.dtab td.narrow{width:120px;}
table.dtab td.mid{width:170px;}
td.desc-cell input{font-family:'IBM Plex Sans',sans-serif;}

.icon-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink-soft);
  width:26px;height:26px;
  border-radius:2px;
  cursor:pointer;
  font-size:14px;
  line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{border-color:var(--rust);color:var(--rust);background:#FBF1EE;}

.btn{
  border:1px solid var(--ink);
  background:#fff;
  color:var(--ink);
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  border-radius:2px;
  cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif;
}
.btn:hover{background:var(--ink);color:#fff;}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff;}
.btn.primary:hover{background:var(--steel-dark);border-color:var(--steel-dark);}
.btn.ghost{border-color:var(--line);color:var(--ink-soft);}
.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.small{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn[disabled]:hover{background:#fff;color:var(--ink);}
.btn.primary[disabled]:hover{background:var(--steel);color:#fff;}

.add-row{margin-top:10px;}

.param-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;}
.param-field label{
  display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);

}
.param-field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
.param-field input[type=number]{

  font-family:'IBM Plex Mono',monospace;font-size:14px;
}
.param-field input:focus{outline:none;border-color:var(--steel);}
.switch-row{display:flex;align-items:center;gap:10px;padding-top:6px;}
.switch{

}
.switch.on{background:var(--steel);}
.switch .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:left .15s;}
.switch.on .knob{left:19px;}

.optimize-bar{

}
.optimize-btn{

}
.optimize-btn:hover{background:var(--steel-dark);}
.optimize-btn[disabled]{opacity:.5;cursor:not-allowed;}
.optimize-btn .spin{
  display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;margin-right:10px;vertical-align:-2px;

}

.error-banner{

}

table.cmp tr:hover td{background:#FAFBFA;}

.plan-body{padding:14px 18px 20px;}

.bar-row{margin-bottom:14px;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
.bar-row .bar-label{

.bar-row .bar-label .stats{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);display:flex;gap:12px;}
.bar-viz{display:flex;height:38px;width:100%;}
.seg{
  height:100%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10.5px;font-family:'IBM Plex Mono',monospace;overflow:hidden;
  border-right:1px solid rgba(255,255,255,.5);white-space:nowrap;
}
.seg:last-of-type{border-right:none;}
.seg.offcut{
  background:repeating-linear-gradient(135deg,var(--offcut),var(--offcut) 6px,#DCDFD9 6px,#DCDFD9 12px);

}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 4px;font-size:12px;}
.legend .item{display:flex;align-items:center;gap:6px;}
.legend .swatch{width:11px;height:11px;border-radius:2px;flex:none;}

.offcut-tags{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-family:'IBM Plex Mono',monospace;margin-top:6px;}
.tag-reuse{background:#E9F3EC;color:var(--good);padding:2px 6px;border-radius:2px;}
.tag-waste{background:#FBF1EE;color:var(--warn);padding:2px 6px;border-radius:2px;}

.downloads{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 18px;border-top:1px solid var(--line);
}
.downloads .grow{flex:1;}

.footer-actions{display:flex;justify-content:space-between;padding-top:8px;flex-wrap:wrap;gap:10px;}

.empty-note{color:var(--ink-soft);font-size:13px;padding:6px 2px;}

@media (max-width:640px){
  .masthead{flex-direction:column;align-items:flex-start;}
  table.dtab{font-size:12px;}
  .plan-head{flex-direction:column;align-items:flex-start;}
}

<body>
<div id="app"></div>

<script>
/* =========================================================================
   STATE
   ========================================================================= */
const state = {
  standardLengths: [3000, 6000, 12000],
  cuts: [
    {id: 1, partNo: 'P001', length: 1200, qty: 4, desc: 'Part A'},
    {id: 2, partNo: 'P002', length: 850,  qty: 3, desc: 'Part B'},
    {id: 3, partNo: 'P003', length: 1500, qty: 2, desc: 'Part C'},
    {id: 4, partNo: 'P004', length: 700,  qty: 3, desc: 'Part D'}
  ],
  kerf: 0,
  endTrim: 0,
  allowExtra: false,
  minReusable: 0,
  errors: [],
  notices: [],
  results: null,     // { byLength:{L:result}, order:[L...], recommended:L }
  expanded: {},       // {L: bool}  comparison-row expansion
  optimizing: false,
  cutIdSeq: 5
};

const PALETTE = ['#2B5F8A','#B5502F','#4C6B4A','#8A6D2F','#5B5F73','#6E4C63','#3D7A72','#7A5230'];
const partColorMap = new Map();
function colorForPart(partNo){
  if(!partColorMap.has(partNo)){
    partColorMap.set(partNo, PALETTE[partColorMap.size % PALETTE.length]);
  }
  return partColorMap.get(partNo);
}

function fmt(n, dp){
  if(n===undefined||n===null||isNaN(n)) return '—';
  dp = (dp===undefined)?0:dp;
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
}
function uid(){ return state.cutIdSeq++; }

/* =========================================================================
   OPTIMIZATION ENGINE
   Method: pattern-based Best-Fit-Decreasing initial packing, then iterative
   local-search improvement (bin-elimination redistribution + pairwise bin
   merge) to reduce bar count / waste, followed by full mathematical
   verification of quantities, dimensional feasibility and material balance.
   ========================================================================= */

// Engineering assumption (displayed in the UI):
// Total Required Length for a bar = Sum of Cut Lengths on that bar
//                                    + (Kerf x Number of pieces on that bar)
//                                    + End Trim (one flat allowance per bar)
// i.e. every individual piece cut from a bar consumes one kerf width,
// and End Trim is a single fixed allowance per bar (material lost to
// squaring/handling the bar ends), independent of how many pieces it holds.

function usedLengthOf(pieces, kerf, endTrim){
  const sum = pieces.reduce((s,p)=>s+p.length,0);
  return sum + kerf*pieces.length + endTrim;
}

function optimizeForLength(L, cuts, kerf, endTrim, allowExtra, minReusable){
  // Feasibility: can every individual part even fit on its own on this bar?
  for(const c of cuts){
    const need = c.length + kerf*1 + endTrim;
    if(need > L + 1e-9){
      return {
        feasible:false,
        length:L,
        reason:`${c.partNo} requires a ${fmt(c.length,2)} mm cut (plus kerf/end trim), which exceeds the ${fmt(L,0)} mm standard length.`
      };
    }
  }

  // Expand demand into an individual-piece list.
  let pieces = [];
  cuts.forEach(c=>{
    for(let i=0;i<c.qty;i++) pieces.push({partNo:c.partNo, length:c.length});
  });
  pieces.sort((a,b)=>b.length-a.length);

  function fits(existing, piece){
    return usedLengthOf(existing.concat([piece]), kerf, endTrim) <= L + 1e-9;
  }

  // ---- Initial packing: Best-Fit-Decreasing ----
  let bins = [];
  for(const piece of pieces){
    let bestIdx=-1, bestSlack=Infinity;
    for(let i=0;i<bins.length;i++){
      if(fits(bins[i].pieces, piece)){
        const slack = L - usedLengthOf(bins[i].pieces.concat([piece]), kerf, endTrim);
        if(slack < bestSlack){ bestSlack=slack; bestIdx=i; }
      }
    }
    if(bestIdx===-1) bins.push({pieces:[piece]});
    else bins[bestIdx].pieces.push(piece);
  }

  // ---- Improvement pass 1: bin-elimination redistribution ----
  let improved = true, guard = 0;
  while(improved && guard < 400){
    improved = false; guard++;
    bins.sort((a,b)=>usedLengthOf(a.pieces,kerf,endTrim)-usedLengthOf(b.pieces,kerf,endTrim));
    for(let i=0;i<bins.length;i++){
      const target = bins[i];
      const others = bins.filter((_,idx)=>idx!==i).map(b=>({pieces:b.pieces.slice()}));
      const toPlace = target.pieces.slice().sort((a,b)=>b.length-a.length);
      let ok = true;
      for(const piece of toPlace){
        let bestIdx=-1, bestSlack=Infinity;
        for(let j=0;j<others.length;j++){
          if(fits(others[j].pieces, piece)){
            const slack = L - usedLengthOf(others[j].pieces.concat([piece]), kerf, endTrim);
            if(slack<bestSlack){ bestSlack=slack; bestIdx=j; }
          }
        }
        if(bestIdx===-1){ ok=false; break; }
        others[bestIdx].pieces.push(piece);
      }
      if(ok){
        bins = others;
        improved = true;
        break;
      }
    }
  }

  // ---- Improvement pass 2: pairwise bin merge ----
  if(bins.length <= 500){
    let merged = true, g2 = 0;
    while(merged && g2 < 2000){
      merged = false; g2++;
      outer:
      for(let i=0;i<bins.length;i++){
        for(let j=i+1;j<bins.length;j++){
          const combined = bins[i].pieces.concat(bins[j].pieces);
          if(usedLengthOf(combined,kerf,endTrim) <= L + 1e-9){
            bins[i] = {pieces:combined};
            bins.splice(j,1);
            merged = true;
            break outer;
          }
        }
      }
    }
  }

  // ---- Build bar result objects ----
  const bars = bins.map((b,idx)=>{
    const orderedPieces = b.pieces.slice().sort((a,b2)=>b2.length-a.length);
    const used = usedLengthOf(orderedPieces, kerf, endTrim);
    const offcut = L - used;
    const grouped = [];
    const map = new Map();
    orderedPieces.forEach(p=>{
      const key = p.partNo+'|'+p.length;
      if(!map.has(key)){ const g={partNo:p.partNo,length:p.length,qty:0}; map.set(key,g); grouped.push(g); }
      map.get(key).qty++;
    });
    return {
      barNo: idx+1,
      piecesOrdered: orderedPieces,
      segments: grouped,
      used, offcut,
      utilization: used/L*100,
      unusable: offcut < minReusable - 1e-9,
      reusable: offcut >= minReusable - 1e-9 && offcut > 1e-9
    };
  }).sort((a,b)=>a.barNo-b.barNo);

  // ---- Verification ----
  const produced = {};
  bars.forEach(b=>b.segments.forEach(s=>{ produced[s.partNo] = (produced[s.partNo]||0) + s.qty; }));
  let qtyOk = true; const qtyIssues = [];
  cuts.forEach(c=>{
    const p = produced[c.partNo] || 0;
    const good = allowExtra ? (p >= c.qty) : (p === c.qty);
    if(!good){ qtyOk = false; qtyIssues.push(`${c.partNo}: required ${c.qty}, produced ${p}`); }
  });
  const dimOk = bars.every(b => b.used <= L + 1e-6);

  const totalMaterial = bars.length * L;
  const totalUsed = bars.reduce((s,b)=>s+b.used,0);
  const totalOffcut = totalMaterial - totalUsed;
  const totalRequiredCutLength = cuts.reduce((s,c)=>s+c.length*c.qty,0);
  const unusableWaste = bars.reduce((s,b)=>s + (b.unusable ? b.offcut : 0), 0);
  const reusableOffcut = bars.reduce((s,b)=>s + (b.reusable ? b.offcut : 0), 0);
  const utilization = totalMaterial>0 ? (totalUsed/totalMaterial*100) : 0;
  const wastePct = totalMaterial>0 ? (totalOffcut/totalMaterial*100) : 0;
  const balanceOk = Math.abs(totalMaterial - (totalUsed + totalOffcut)) < 1e-6;

  return {
    feasible: true,
    length: L,
    bars,
    totalMaterial, totalUsed, totalOffcut, totalRequiredCutLength,
    unusableWaste, reusableOffcut,
    utilization, wastePct,
    verified: qtyOk && dimOk && balanceOk,
    qtyIssues
  };
}

function runOptimization(){
  state.errors = [];
  const lens = Array.from(new Set(state.standardLengths.map(Number).filter(n=>n>0))).sort((a,b)=>a-b);
  const validCuts = state.cuts.filter(c=>c.partNo && c.partNo.trim() && Number(c.length)>0 && Number(c.qty)>0)
                               .map(c=>({partNo:c.partNo.trim(), length:Number(c.length), qty:Math.round(Number(c.qty)), desc:c.desc||''}));

  if(lens.length===0) state.errors.push('Add at least one standard material length.');
  if(validCuts.length===0) state.errors.push('Add at least one valid required cut length (length and quantity must be greater than zero).');

  const seenPart = new Set();
  validCuts.forEach(c=>{
    if(seenPart.has(c.partNo)) state.errors.push(`Duplicate part number: ${c.partNo}. Part numbers must be unique.`);
    seenPart.add(c.partNo);
  });

  if(state.errors.length){ render(); return; }

  const kerf = Number(state.kerf)||0;
  const endTrim = Number(state.endTrim)||0;
  const minReusable = Number(state.minReusable)||0;

  const byLength = {};
  lens.forEach(L=>{
    byLength[L] = optimizeForLength(L, validCuts, kerf, endTrim, state.allowExtra, minReusable);
  });

  const feasible = lens.filter(L=>byLength[L].feasible);
  if(feasible.length===0){
    state.errors.push('No entered standard length can accommodate every required cut. Add a longer standard length, or split the oversized part into smaller required lengths.');
    lens.forEach(L=>{ if(!byLength[L].feasible) state.errors.push(byLength[L].reason); });
    render();
    return;
  }

  feasible.sort((a,b)=>{
    const ra = byLength[a], rb = byLength[b];
    if(ra.bars.length !== rb.bars.length) return ra.bars.length - rb.bars.length;
    if(Math.abs(ra.totalOffcut-rb.totalOffcut) > 1e-6) return ra.totalOffcut - rb.totalOffcut;
    if(Math.abs(ra.utilization-rb.utilization) > 1e-6) return rb.utilization - ra.utilization;
    return 0;
  });

  state.results = { byLength, order: lens, recommended: feasible[0], cutsSnapshot: validCuts, kerf, endTrim, minReusable, allowExtra: state.allowExtra };
  lens.forEach(L=>{ if(state.expanded[L]===undefined) state.expanded[L] = (L===feasible[0]); });
  render();
  const el = document.getElementById('results-anchor');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderComparisonTable(){

    return `<tr class="${isBest?'best':''}" data-action="toggle-expand" data-len="${L}">
      <td>${fmt(L,0)} mm</td>

function renderBarViz(bar, L){
  const segs = bar.piecesOrdered.map(p=>{

  }).join('');

  const offcutSeg = bar.offcut>1e-6 ? `<div class="seg offcut" style="width:${offcutW}%;" title="Offcut — ${fmt(bar.offcut,2)} mm">${bar.offcut/L>0.05?'OFFCUT':''}</div>` : '';
  return `<div class="bar-viz">${segs}${offcutSeg}</div>`;
}

function renderPlanForLength(L){
  const R = state.results;
  const r = R.byLength[L];
  const expanded = !!state.expanded[L];
  if(!r.feasible){
    return `<div class="plan-block"><div class="plan-head"><h3>${fmt(L,0)} mm Cut Plan</h3><span class="meta" style="color:var(--rust);">Infeasible</span></div><div class="plan-body"><p style="color:var(--rust);font-size:13px;">${esc(r.reason)}</p></div></div>`;
  }
  if(!expanded){
    return `<div class="plan-block">
      <div class="plan-head" data-action="toggle-expand" data-len="${L}" style="cursor:pointer;">
        <h3>${fmt(L,0)} mm Cut Plan${L===R.recommended?' <span class="tag-best" style="margin-left:8px;">RECOMMENDED</span>':''}</h3>
        <span class="meta">${r.bars.length} bars · ${fmt(r.wastePct,2)}% waste — click to expand</span>
      </div>
    </div>`;
  }

  const legendParts = Array.from(new Set(r.bars.flatMap(b=>b.segments.map(s=>s.partNo))));
  const legend = legendParts.map(p=>`<div class="item"><span class="swatch" style="background:${colorForPart(p)};"></span>${esc(p)}</div>`).join('');

  const bars = r.bars.map(b=>{
    const patt = b.segments.map(s=>`${fmt(s.length,s.length%1?2:0)}&times;${s.qty}`).join(' + ');
    return `
    <div class="bar-row">
      <div class="bar-label">
        <span><span class="bn">Bar ${b.barNo}</span> — ${fmt(L,0)} mm &nbsp; <span class="mono" style="color:var(--ink-soft);">${patt}</span></span>
        <span class="stats">
          <span>Used ${fmt(b.used,2)} mm</span>
          <span>Offcut ${fmt(b.offcut,2)} mm</span>
          <span>Util. ${fmt(b.utilization,2)}%</span>
        </span>
      </div>
      ${renderBarViz(b, L)}
    </div>`;
  }).join('');

  const reusableCount = r.bars.filter(b=>b.reusable).length;
  const unusableCount = r.bars.filter(b=>b.unusable && b.offcut>1e-6).length;

  return `<div class="plan-block">
    <div class="plan-head" data-action="toggle-expand" data-len="${L}" style="cursor:pointer;">
      <h3>${fmt(L,0)} mm Cut Plan${L===R.recommended?' <span class="tag-best" style="margin-left:8px;">RECOMMENDED</span>':''}</h3>
      <span class="meta">Minimum Bars Required = ${r.bars.length} &nbsp;·&nbsp; Total Material = ${fmt(r.totalMaterial,0)} mm &nbsp;·&nbsp; Total Offcut = ${fmt(r.totalOffcut,1)} mm &nbsp;·&nbsp; Utilization = ${fmt(r.utilization,2)}%</span>
    </div>
    <div class="plan-body">
      <div class="assumption">Calculation basis: Total Required Length per bar = Sum of Cut Lengths + (Kerf &times; number of pieces on the bar) + End Trim (applied once per bar). A pattern is valid only when this total &le; ${fmt(L,0)} mm.</div>
      <div class="legend">${legend}<div class="item"><span class="swatch" style="background:var(--offcut);"></span>Offcut</div></div>
      ${bars}
      <div class="offcut-tags">
        ${reusableCount?`<span class="tag-reuse">${reusableCount} bar(s) with potentially reusable offcut (&ge; ${fmt(r.__minReusable||0,0)} mm)</span>`:''}
        ${unusableCount?`<span class="tag-waste">${unusableCount} bar(s) with unusable offcut</span>`:''}
      </div>
    </div>
    <div class="downloads">
      <button class="btn small" data-action="print-plan" data-len="${L}">Print Cut Plan</button>
      <button class="btn small primary" data-action="download-plan" data-len="${L}">Download ${fmt(L,0)} mm Cut Plan (.xlsx)</button>
    </div>
  </div>`;
}

/* =========================================================================
   EVENT HANDLING
   ========================================================================= */
document.addEventListener('input', (e)=>{
  const t = e.target;
  const bind = t.getAttribute('data-bind');
  if(!bind) return;
  if(bind==='len'){
    const idx = Number(t.getAttribute('data-idx'));
    state.standardLengths[idx] = t.value;
  } else if(bind==='kerf'){ state.kerf = t.value; }
  else if(bind==='endTrim'){ state.endTrim = t.value; }
  else if(bind==='minReusable'){ state.minReusable = t.value; }
  else if(bind.startsWith('cut-')){
    const id = Number(t.getAttribute('data-id'));
    const cut = state.cuts.find(c=>c.id===id);
    if(!cut) return;
    const field = bind.replace('cut-','');
    cut[field] = t.value;
  }
});

document.addEventListener('blur', (e)=>{
  const t = e.target;
  if(t.getAttribute && t.getAttribute('data-bind')==='len'){
    // merge duplicate standard lengths silently
    const vals = state.standardLengths.map(Number);
    const dedup = [];
    vals.forEach(v=>{ if(v>0 && !dedup.includes(v)) dedup.push(v); });
    dedup.sort((a,b)=>a-b);
    state.standardLengths = dedup.length? dedup : state.standardLengths;
    render();
  }
}, true);

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action==='add-length'){
    state.standardLengths.push('');
    render();
  } else if(action==='del-length'){
    const idx = Number(el.getAttribute('data-idx'));
    state.standardLengths.splice(idx,1);
    render();
  } else if(action==='add-cut'){
    const n = state.cuts.length+1;
    state.cuts.push({id: uid(), partNo:`P${String(n).padStart(3,'0')}`, length:'', qty:1, desc:''});
    render();
  } else if(action==='del-cut'){
    const id = Number(el.getAttribute('data-id'));
    state.cuts = state.cuts.filter(c=>c.id!==id);
    render();
  } else if(action==='toggle-extra'){
    state.allowExtra = !state.allowExtra;
    render();
  } else if(action==='optimize'){
    state.optimizing = true;
    render();
    setTimeout(()=>{
      try{ runOptimization(); }
      finally{ state.optimizing = false; render(); }
    }, 30);
  } else if(action==='reset-all'){
    state.standardLengths = [];
    state.cuts = [];
    state.kerf = 0; state.endTrim = 0; state.allowExtra = false; state.minReusable = 0;
    state.errors = []; state.results = null; state.expanded = {};
    render();
  } else if(action==='load-example'){
    state.standardLengths = [3000,6000,12000];
    state.cuts = [
      {id:uid(), partNo:'P001', length:1200, qty:4, desc:'Part A'},
      {id:uid(), partNo:'P002', length:850, qty:3, desc:'Part B'},
      {id:uid(), partNo:'P003', length:1500, qty:2, desc:'Part C'},
      {id:uid(), partNo:'P004', length:700, qty:3, desc:'Part D'}
    ];
    state.kerf = 0; state.endTrim = 0; state.allowExtra=false; state.minReusable=0;
    state.errors = []; state.results = null; state.expanded = {};
    render();
  } else if(action==='toggle-expand'){
    const L = Number(el.getAttribute('data-len'));
    state.expanded[L] = !state.expanded[L];
    render();
  } else if(action==='print-plan'){
    const L = Number(el.getAttribute('data-len'));
    openPrintView(L);
  } else if(action==='download-plan'){
    const L = Number(el.getAttribute('data-len'));
    el.disabled = true; const orig = el.textContent; el.textContent='Building…';
    try{ await downloadPlanForLength(L); } finally { el.disabled=false; el.textContent=orig; }
  } else if(action==='download-all'){
    el.disabled = true; const orig = el.textContent; el.textContent='Building ZIP…';
    try{ await downloadAllPlans(); } finally { el.disabled=false; el.textContent=orig; }
  }
});

function buildPrintHTML(L){

  const barsHtml = r.bars.map(b=>{
    const segHtml = b.piecesOrdered.map(p=>{
      const w = (p.length/L*100).toFixed(3);
      return `<div style="width:${w}%;background:${colorForPart(p.partNo)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace;height:34px;box-sizing:border-box;border-right:1px solid #fff;">${p.length/L>0.06?esc(p.partNo)+' '+fmt(p.length,0):''}</div>`;
    }).join('');
    const offcutW = (b.offcut/L*100).toFixed(3);
    const offcutHtml = b.offcut>1e-6 ? `<div style="width:${offcutW}%;background:#C9CDC6;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace;height:34px;box-sizing:border-box;color:#555;">${b.offcut/L>0.05?'OFFCUT':''}</div>` : '';
    return `
    <div style="margin-bottom:14px;break-inside:avoid;">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-family:monospace;margin-bottom:3px;">
        <strong>BAR ${b.barNo}</strong>
        <span>Used ${fmt(b.used,2)} mm &nbsp; Offcut ${fmt(b.offcut,2)} mm &nbsp; Utilization ${fmt(b.utilization,2)}%</span>
      </div>
      <div style="display:flex;width:100%;border:1px solid #333;">${segHtml}${offcutHtml}</div>
    </div>`;
  }).join('');

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cut Plan ${L}mm</title>
  <style>
    @page{ size: landscape; margin: 14mm; }
    body{ font-family: 'IBM Plex Sans', Arial, sans-serif; color:#1B2126; padding:0; margin:0;}
    h1{ font-size:20px; margin:0 0 4px; }
    .meta-line{ font-family: monospace; font-size:13px; margin:2px 0; }
    .legend{ display:flex; gap:14px; font-size:11px; margin:10px 0 16px; flex-wrap:wrap;}
    .sw{ display:inline-block; width:10px;height:10px;margin-right:4px;vertical-align:-1px; }
    .assumption{ font-size:10.5px; color:#555; border:1px dashed #999; padding:6px 9px; margin-bottom:14px;}
  </style></head>
  <body>
    <h1>STANDARD MATERIAL: ${fmt(L,0)} mm</h1>
    <div class="meta-line">Minimum Bars Required: ${r.bars.length}</div>
    <div class="meta-line">Total Material: ${fmt(r.totalMaterial,0)} mm &nbsp;|&nbsp; Total Required Cut Length: ${fmt(r.totalRequiredCutLength,0)} mm &nbsp;|&nbsp; Total Offcut: ${fmt(r.totalOffcut,1)} mm</div>
    <div class="meta-line">Utilization: ${fmt(r.utilization,2)}% &nbsp;|&nbsp; Waste: ${fmt(r.wastePct,2)}% &nbsp;|&nbsp; Kerf: ${fmt(R.kerf,2)} mm &nbsp;|&nbsp; End Trim: ${fmt(R.endTrim,2)} mm</div>
    <div class="assumption">Basis: Total Required Length per bar = Sum of Cut Lengths + (Kerf &times; pieces on bar) + End Trim (once per bar); valid only when &le; standard length.</div>
    <div class="legend">${legendParts.map(p=>`<span><span class="sw" style="background:${colorForPart(p)};"></span>${esc(p)}</span>`).join('')}<span><span class="sw" style="background:#C9CDC6;"></span>Offcut</span></div>
    ${barsHtml}
    <script>window.onload=function(){ setTimeout(function(){ window.print(); }, 200); };<\/script>
  </body></html>`;
}

function openPrintView(L){
  const html = buildPrintHTML(L);
  const w = window.open('', '_blank');
  if(!w){ alert('Please allow pop-ups to print the cut plan.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* =========================================================================
   EXCEL EXPORT (ExcelJS) — Sheet 1 mirrors the Print / Web view exactly,
   using the same result object as the single source of truth.
   ========================================================================= */
const DIAGRAM_UNITS = 48;

function styleCell(cell, opts){
  opts = opts||{};
  if(opts.bold!==undefined || opts.size || opts.color) cell.font = Object.assign({}, cell.font, {bold:!!opts.bold, size:opts.size||11, color: opts.color?{argb:opts.color}:undefined});
  if(opts.fill) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:opts.fill}};
  if(opts.align) cell.alignment = Object.assign({vertical:'middle'}, opts.align);
  if(opts.border!==false) cell.border = {top:{style:'thin',color:{argb:'FFB8BEC2'}},left:{style:'thin',color:{argb:'FFB8BEC2'}},bottom:{style:'thin',color:{argb:'FFB8BEC2'}},right:{style:'thin',color:{argb:'FFB8BEC2'}}};
}

function addBarDiagram(ws, rowStart, bar, L){
  // Segment row: merged cells proportional to length, colored per part.
  const total = DIAGRAM_UNITS;
  let col = 1;
  const segRow = rowStart;
  ws.getRow(segRow).height = 30;
  bar.segments.forEach((seg, i)=>{
    const segLen = seg.length*seg.qty;
    let span = Math.max(1, Math.round(segLen/L*total));
    const startCol = col, endCol = Math.min(total, col+span-1);
    if(startCol>total) return;
    if(endCol>startCol) ws.mergeCells(segRow,startCol,segRow,endCol);
    const cell = ws.getCell(segRow,startCol);
    cell.value = seg.qty>1 ? `${seg.partNo} x${seg.qty}\n${fmt(seg.length,seg.length%1?2:0)} mm` : `${seg.partNo}\n${fmt(seg.length,seg.length%1?2:0)} mm`;
    styleCell(cell, {fill: hexFor(seg.partNo), color:'FFFFFFFF', bold:true, size:9, align:{horizontal:'center', wrapText:true}});
    for(let c=startCol;c<=endCol;c++){ const cc=ws.getCell(segRow,c); if(c!==startCol){ cc.fill=cell.fill; cc.border=cell.border; } }
    col = endCol+1;
  });
  if(bar.offcut>1e-6 && col<=total){
    const span = Math.max(1, total-col+1);
    const startCol = col, endCol = total;
    if(endCol>startCol) ws.mergeCells(segRow,startCol,segRow,endCol);
    const cell = ws.getCell(segRow,startCol);
    cell.value = `OFFCUT\n${fmt(bar.offcut,2)} mm`;
    styleCell(cell, {fill:'FFC9CDC6', color:'FF444444', bold:true, size:9, align:{horizontal:'center', wrapText:true}});
    for(let c=startCol;c<=endCol;c++){ const cc=ws.getCell(segRow,c); if(c!==startCol){ cc.fill=cell.fill; cc.border=cell.border; } }
  }
  // stats row below
  const statRow = rowStart+1;
  ws.mergeCells(statRow,1,statRow,total);
  const sc = ws.getCell(statRow,1);
  sc.value = `Used = ${fmt(bar.used,2)} mm      Offcut = ${fmt(bar.offcut,2)} mm      Utilization = ${fmt(bar.utilization,2)}%`;
  sc.font = {italic:true, size:10, color:{argb:'FF4A535C'}};
  sc.alignment = {horizontal:'left'};
  return statRow+1;
}

function hexFor(partNo){
  const c = colorForPart(partNo).replace('#','');
  return 'FF'+c.toUpperCase();
}

async function buildWorkbookForLength(L){
  const R = state.results;
  const r = R.byLength[L];
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Standard Material Cut Length Optimizer';
  wb.created = new Date();

  // ---- Sheet 1: Cut Plan / Print View ----
  const ws = wb.addWorksheet('Cut Plan', {
    pageSetup: {orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}}
  });
  for(let c=1;c<=DIAGRAM_UNITS;c++) ws.getColumn(c).width = 2.6;

  ws.mergeCells(1,1,1,DIAGRAM_UNITS);
  const title = ws.getCell(1,1);
  title.value = `STANDARD MATERIAL: ${fmt(L,0)} mm`;
  title.font = {size:16, bold:true};
  ws.getRow(1).height = 24;

  const summaryLines = [
    `Minimum Bars Required: ${r.bars.length}`,
    `Total Material: ${fmt(r.totalMaterial,0)} mm    Total Required Cut Length: ${fmt(r.totalRequiredCutLength,0)} mm    Total Offcut: ${fmt(r.totalOffcut,1)} mm`,
    `Utilization: ${fmt(r.utilization,2)}%    Waste: ${fmt(r.wastePct,2)}%    Kerf: ${fmt(R.kerf,2)} mm    End Trim: ${fmt(R.endTrim,2)} mm`,
    `Optimization Status: ${r.verified?'VERIFIED':'VALIDATION ERROR'}`
  ];
  let rowN = 2;
  summaryLines.forEach(line=>{
    ws.mergeCells(rowN,1,rowN,DIAGRAM_UNITS);
    const c = ws.getCell(rowN,1);
    c.value = line;
    c.font = {bold: rowN===2, size:11};
    rowN++;
  });
  rowN++;

  r.bars.forEach(bar=>{
    ws.mergeCells(rowN,1,rowN,DIAGRAM_UNITS);
    const bh = ws.getCell(rowN,1);
    bh.value = `BAR ${bar.barNo} — ${fmt(L,0)} mm`;
    bh.font = {bold:true, size:11};
    bh.border = {top:{style:'medium'}};
    rowN++;
    rowN = addBarDiagram(ws, rowN, bar, L);
    rowN++;
  });

  // ---- Sheet 2: Detailed Cut Data ----
  const ws2 = wb.addWorksheet('Detailed Cut Data');
  ws2.columns = [
    {header:'Bar No.', key:'bar', width:10},
    {header:'Part No.', key:'part', width:14},
    {header:'Cut Length (mm)', key:'len', width:16},
    {header:'Quantity', key:'qty', width:12},
    {header:'Used Length (mm)', key:'used', width:16},
    {header:'Offcut (mm)', key:'off', width:14}
  ];
  ws2.getRow(1).font = {bold:true};
  ws2.getRow(1).eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFF1EE'}}; });
  r.bars.forEach(bar=>{
    bar.segments.forEach(seg=>{
      ws2.addRow({bar:bar.barNo, part:seg.partNo, len:seg.length, qty:seg.qty, used:Number(bar.used.toFixed(2)), off:Number(bar.offcut.toFixed(2))});
    });
  });

  // ---- Sheet 3: Summary ----
  const ws3 = wb.addWorksheet('Summary');
  ws3.columns = [{header:'Parameter', key:'k', width:28},{header:'Result', key:'v', width:20}];
  ws3.getRow(1).font = {bold:true};
  const summaryRows = [
    ['Standard Length', `${fmt(L,0)} mm`],
    ['Minimum Bars Required', r.bars.length],
    ['Total Material', `${fmt(r.totalMaterial,0)} mm`],
    ['Total Required Cut Length', `${fmt(r.totalRequiredCutLength,0)} mm`],
    ['Total Offcut', `${fmt(r.totalOffcut,2)} mm`],
    ['Unusable Waste', `${fmt(r.unusableWaste,2)} mm`],
    ['Waste %', `${fmt(r.wastePct,2)}%`],
    ['Utilization %', `${fmt(r.utilization,2)}%`],
    ['Kerf', `${fmt(R.kerf,2)} mm`],
    ['End Trim', `${fmt(R.endTrim,2)} mm`],
    ['Optimization Status', r.verified?'Verified':'Validation Error']
  ];
  summaryRows.forEach(row=>ws3.addRow({k:row[0], v:row[1]}));

  return wb;
}

async function downloadPlanForLength(L){
  const wb = await buildWorkbookForLength(L);
  const buf = await wb.xlsx.writeBuffer();
  saveAs(new Blob([buf], {type:'application/octet-stream'}), `Cut_Plan_${fmt(L,0)}mm.xlsx`);
}

async function buildOverallComparisonWorkbook(){
  const R = state.results;
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Comparison');
  ws.columns = [
    {header:'Standard Length', key:'l', width:16},
    {header:'Minimum Bars', key:'b', width:14},
    {header:'Total Material', key:'m', width:14},
    {header:'Total Required Length', key:'req', width:18},
    {header:'Total Offcut', key:'o', width:14},
    {header:'Waste %', key:'w', width:12},
    {header:'Utilization %', key:'u', width:14},
    {header:'Recommendation', key:'rec', width:16}
  ];
  ws.getRow(1).font = {bold:true};
  ws.getRow(1).eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFF1EE'}}; });
  R.order.forEach(L=>{
    const r = R.byLength[L];
    const row = ws.addRow(r.feasible ? {
      l:`${fmt(L,0)} mm`, b:r.bars.length, m:r.totalMaterial, req:r.totalRequiredCutLength, o:Number(r.totalOffcut.toFixed(2)),
      w:`${fmt(r.wastePct,2)}%`, u:`${fmt(r.utilization,2)}%`, rec: L===R.recommended?'BEST':'—'
    } : { l:`${fmt(L,0)} mm`, b:'—', m:'—', req:'—', o:'—', w:'—', u:'—', rec:'Infeasible' });
    if(L===R.recommended){
      row.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE9F3EC'}}; c.font={bold:true}; });
    }
  });

  const ws2 = wb.addWorksheet('Selection Logic');
  ws2.columns = [{header:'Priority', key:'p', width:10},{header:'Criterion', key:'c', width:60}];
  ws2.getRow(1).font = {bold:true};
  [
    [1,'Minimum number of standard bars required to produce all requested parts and quantities.'],
    [2,'If tied on bar count, the lowest total material waste / offcut.'],
    [3,'If still tied, the highest material utilization.'],
    [4,'If still tied, fewer different standard lengths (not applicable when comparing one standard length at a time).']
  ].forEach(row=>ws2.addRow({p:row[0], c:row[1]}));
  ws2.addRow({});
  ws2.addRow({p:'', c:`Recommended standard length: ${fmt(R.recommended,0)} mm`});

  return wb;
}

async function downloadAllPlans(){
  const R = state.results;
  const zip = new JSZip();
  for(const L of R.order){
    if(!R.byLength[L].feasible) continue;
    const wb = await buildWorkbookForLength(L);
    const buf = await wb.xlsx.writeBuffer();
    zip.file(`Cut_Plan_${fmt(L,0)}mm.xlsx`, buf);
  }
  const cwb = await buildOverallComparisonWorkbook();
  const cbuf = await cwb.xlsx.writeBuffer();
  zip.file('Overall_Comparison.xlsx', cbuf);
  const blob = await zip.generateAsync({type:'blob'});
  saveAs(blob, 'Cut_Plans.zip');
}

/* Initial render */
render();
